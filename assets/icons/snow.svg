<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" shape-rendering="crispEdges">
  <!-- 雪：黑云 + 三颗红色雪点（一字排开）
       30px 下六角雪花挤不下会糊成方块，改用实心雪点，
       与"雨=斜线"形成明确区分 -->
  <g fill="#000000">
    <circle cx="11" cy="12" r="4.8"/>
    <circle cx="17" cy="9.5" r="5.8"/>
    <circle cx="22.5" cy="12.5" r="4.4"/>
    <rect x="6.5" y="12" width="17.5" height="4.5"/>
  </g>
  <g fill="#E00000">
    <circle cx="9"  cy="23.5" r="1.8"/>
    <circle cx="15" cy="23.5" r="1.8"/>
    <circle cx="21" cy="23.5" r="1.8"/>
  </g>
</svg>
